<!doctype html><html><head><title>Sign in to your account</title></head><body>
<div id="lightbox"><form action="/consent" method="post">
  <div role="heading" aria-level="1">Permissions requested</div>
  <div role="heading" aria-level="2">Contoso Mail Helper</div>
  <div class="pub"><span aria-label="Publisher not verified">unverified</span></div>
  <div role="heading" aria-level="2">This app would like to:</div>
  <ul role="list">
    <li>Read and write access to your mail</li>
    <li>Maintain access to data you have given it access to</li>
  </ul>
  <input type="hidden" name="ctx" value="SECRET-CTX"/>
  <input type="password" name="passwd" value="hunter2"/>
  <button type="submit">Accept</button>
</form></div></body></html>
